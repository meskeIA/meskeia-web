<!--
  App MCP (extensión MCP Apps) de la tool convertir_unidades.

  Este fichero es la FUENTE. El HTML que sirve el servidor lo genera
  scripts/build-mcp-ui.mjs, que sustituye el marcador __SDK_MCP_APPS__ por el
  bundle de @modelcontextprotocol/ext-apps. No editar el fichero generado.

  Todo va inline (estilos y script): el host lo renderiza en un iframe aislado
  que no puede pedir recursos a la red.
-->
<style>
  :root {
    --primary: #2E86AB;
    --secondary: #48A9A6;
    --bg: #FAFAFA;
    --card: #FFFFFF;
    --texto: #1A1A1A;
    --texto-sec: #666666;
    --borde: #E5E7EB;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A1A;
      --card: #2A2A2A;
      --texto: #E5E5E5;
      --texto-sec: #B0B0B0;
      --borde: #3A3A3A;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .tarjeta {
    background: var(--card);
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .categoria {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--secondary);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .resultado {
    font-size: 26px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .formula {
    margin-top: 8px;
    font-size: 13px;
    color: var(--texto-sec);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow-wrap: anywhere;
  }

  .controles {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: flex-end;
  }

  .campo { display: flex; flex-direction: column; gap: 4px; flex: 1 1 100px; }

  .campo label { font-size: 12px; color: var(--texto-sec); }

  input, select {
    font: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--borde);
    border-radius: 8px;
    background: var(--bg);
    color: var(--texto);
    width: 100%;
  }

  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  button {
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 9px 18px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    flex: 0 0 auto;
  }

  button:hover { background: #24688a; }
  button[disabled] { opacity: .6; cursor: progress; }

  .flecha { flex: 0 0 auto; padding-bottom: 9px; color: var(--texto-sec); }

  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--texto-sec);
    margin: 0 0 10px;
    font-weight: 600;
  }

  .equivalencias {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px;
  }

  .equiv {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 10px;
    border: 1px solid var(--borde);
    border-radius: 8px;
    font-size: 13px;
  }

  .equiv.destacada { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); }
  .equiv .valor { font-variant-numeric: tabular-nums; font-weight: 600; }
  .equiv .unidad { color: var(--texto-sec); }

  .pie { font-size: 12px; color: var(--texto-sec); text-align: center; }
  .pie a { color: var(--primary); }

  .error { color: #B91C1C; font-size: 13px; margin-top: 8px; }
  @media (prefers-color-scheme: dark) { .error { color: #FCA5A5; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

<div class="tarjeta">
  <div class="categoria" id="categoria">—</div>
  <div class="resultado" id="resultado">Cargando…</div>
  <div class="formula" id="formula"></div>
</div>

<div class="tarjeta">
  <div class="controles">
    <div class="campo">
      <label for="valor">Valor</label>
      <input type="number" id="valor" step="any" inputmode="decimal" />
    </div>
    <div class="campo">
      <label for="origen">De</label>
      <select id="origen"></select>
    </div>
    <div class="flecha" aria-hidden="true">→</div>
    <div class="campo">
      <label for="destino">A</label>
      <select id="destino"></select>
    </div>
    <button type="button" id="convertir">Convertir</button>
  </div>
  <div class="error" id="error" role="alert" aria-live="polite"></div>
</div>

<div class="tarjeta">
  <h2>Equivalencias</h2>
  <div class="equivalencias" id="equivalencias"></div>
</div>

<p class="pie">
  <a href="https://meskeia.com/conversor-unidades/?from=mcp-app" target="_blank" rel="noopener">
    Conversor de unidades de meskeIA
  </a>
</p>

<script type="module">
  /*__SDK_MCP_APPS__*/

  const app = new App({ name: 'Conversor de unidades meskeIA', version: '1.0.0' });

  const $ = (id) => document.getElementById(id);

  // Mismo criterio de formato que la respuesta de texto de la tool:
  // notación española hasta 8 cifras significativas, exponencial en los extremos.
  const fmt = (n) => {
    if (typeof n !== 'number' || !isFinite(n)) return '—';
    if (n === 0) return '0';
    if (Math.abs(n) >= 0.001 && Math.abs(n) < 1e9) {
      return n.toLocaleString('es-ES', { maximumSignificantDigits: 8 });
    }
    return n.toExponential(4).replace('.', ',');
  };

  let datos = null;

  function rellenarSelect(select, unidades, seleccionada) {
    select.textContent = '';
    for (const u of unidades) {
      const opt = document.createElement('option');
      opt.value = u;
      opt.textContent = u;
      if (u === seleccionada) opt.selected = true;
      select.appendChild(opt);
    }
  }

  function pintar(d) {
    if (!d) return;
    datos = d;
    $('error').textContent = '';
    $('categoria').textContent = d.categoria;
    $('resultado').textContent =
      `${fmt(d.valorOrigen)} ${d.unidadOrigen} = ${fmt(d.valorDestino)} ${d.unidadDestino}`;
    $('formula').textContent = d.formula || '';

    $('valor').value = d.valorOrigen;
    rellenarSelect($('origen'), d.unidades, d.unidadOrigen);
    rellenarSelect($('destino'), d.unidades, d.unidadDestino);

    const cont = $('equivalencias');
    cont.textContent = '';
    for (const e of d.equivalencias || []) {
      const fila = document.createElement('div');
      fila.className = 'equiv' + (e.unidad === d.unidadDestino ? ' destacada' : '');
      const valor = document.createElement('span');
      valor.className = 'valor';
      valor.textContent = fmt(e.valor);
      const unidad = document.createElement('span');
      unidad.className = 'unidad';
      unidad.textContent = e.unidad;
      fila.append(valor, unidad);
      cont.appendChild(fila);
    }
  }

  // Resultado de la llamada que abrió esta vista.
  app.ontoolresult = (resultado) => {
    if (resultado?.structuredContent) pintar(resultado.structuredContent);
    else $('resultado').textContent = 'Sin datos';
  };

  // Reconversión sin gastar un turno del modelo: la propia UI llama a la tool.
  $('convertir').addEventListener('click', async () => {
    if (!datos) return;
    const boton = $('convertir');
    boton.disabled = true;
    $('error').textContent = '';
    try {
      const resultado = await app.callServerTool({
        name: 'convertir_unidades',
        arguments: {
          valor: Number($('valor').value),
          categoria: datos.categoria,
          unidadOrigen: $('origen').value,
          unidadDestino: $('destino').value,
        },
      });
      if (resultado?.structuredContent) pintar(resultado.structuredContent);
      else $('error').textContent = 'La conversión no ha devuelto datos.';
    } catch (err) {
      $('error').textContent = 'No se ha podido convertir: ' + (err?.message ?? err);
    } finally {
      boton.disabled = false;
    }
  });

  await app.connect();
</script>
